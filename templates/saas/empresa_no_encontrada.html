<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio No Encontrado - Sistema de Cobro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/saas/errors.css') }}">
</head>
<body>
    <div class="card-error">
        <div class="icon-circle">
            <i class="bi bi-buildings"></i>
        </div>
        <h1>Espacio de Trabajo No Encontrado</h1>
        <div class="subdomain-badge">
            <i class="bi bi-globe2 me-1"></i> {{ slug }}.localhost
        </div>
        <p>El espacio de trabajo que intentas acceder no existe o el subdominio no está registrado en la plataforma.</p>
        <a href="/" class="btn-action">
            <i class="bi bi-arrow-left"></i> Volver al Inicio
        </a>
    </div>
</body>
</html>
