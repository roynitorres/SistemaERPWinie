<!DOCTYPE html>
<html lang="es" data-theme="light" data-theme-fixed="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal del Cliente | SistemaERP Winie{% endblock %}</title>

    <!-- Fijar Modo Claro Inmediato para Portal del Cliente -->
    <script>
        document.documentElement.setAttribute('data-theme', 'light');
    </script>

    <!-- GOOGLE FONTS (INTER) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP 5 & ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Script de Tema Protegido -->
    <script src="{{ url_for('static', filename='js/core/theme.js') }}"></script>

    <!-- ESTILOS APEX DARK -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body class="page-portal">

    <main class="cliente-portal-wrapper">
        {% block content %}{% endblock %}
    </main>

    {% if current_user.is_authenticated %}
        {% include "components/idle_modal.html" %}
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- MÓDULOS JAVASCRIPT CLEAN CODE -->
    <script src="{{ url_for('static', filename='js/core/ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/validators.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modules/portal-cliente.js') }}"></script>
    {% if current_user.is_authenticated %}
    <script src="{{ url_for('static', filename='js/core/idle_timer.js') }}"></script>
    {% endif %}

    {% block scripts %}{% endblock %}
</body>

</html>
