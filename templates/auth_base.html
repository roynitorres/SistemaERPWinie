<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Iniciar Sesión | SistemaERP Winie{% endblock %}</title>

    <!-- GOOGLE FONTS (INTER) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP 5 & ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Script de Tema (Cargado primero para evitar parpadeos) -->
    <script src="{{ url_for('static', filename='js/core/theme.js') }}"></script>

    <!-- ESTILOS GLOBALES Y LOGIN APEX -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body class="page-auth">

    {% block content %}

    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- MÓDULOS JAVASCRIPT CLEAN CODE -->
    <script src="{{ url_for('static', filename='js/core/ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/validators.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modules/auth.js') }}"></script>
</body>

</html>
